[project]
name = "langchain-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xander1936", email = "alexandrehervemassodamambeleck@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "langchain>=1.3.7",
    "langchain-openrouter>=0.2.3",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.0",
]

[project.scripts]
langchain-agent = "langchain_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*", "apps/*"]